license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Local in-world video screens powered by Rinku/Chromium.
Build a rectangular wall of screen blocks, sneak-right-click the face, and choose a local video.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="rinku"
type="required"
versionRange="[${rinku_mod_version},)"
ordering="AFTER"
side="CLIENT"
