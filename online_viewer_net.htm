Put your HTML text <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Online VLC-Style Player</title>
  <style>
    body {
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      font-family: sans-serif;
    }
    video {
      margin-top: 40px;
      max-width: 90%;
      height: auto;
      background: black;
      border: 2px solid #444;
      border-radius: 12px;
    }
    .controls {
      margin-top: 20px;
    }
    input {
      width: 400px;
      padding: 8px;
    }
  </style>
</head>
<body>
  <h2>🎥 Online VLC Player</h2>
  <video id="player" controls autoplay loop>
    <source id="videoSource" src="" type="video/mp4" />
    Your browser does not support HTML5 video.
  </video>

  <div class="controls">
    <input type="text" id="urlInput" placeholder="Video URL gir" />
    <button onclick="loadVideo()">Yükle</button>
  </div>

  <script>
    function getQueryParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    function loadVideo() {
      const url = document.getElementById("urlInput").value;
      const video = document.getElementById("player");
      document.getElementById("videoSource").src = url;
      video.load();
      history.replaceState(null, '', '?video=' + encodeURIComponent(url));

      // Kullanıcı butona tıklayınca tam ekran moduna geç
      if (video.requestFullscreen) {
        video.requestFullscreen();
      } else if (video.webkitRequestFullscreen) { /* Safari */
        video.webkitRequestFullscreen();
      } else if (video.msRequestFullscreen) { /* IE11 */
        video.msRequestFullscreen();
      }
    }

    // Sayfa yüklendiğinde URL parametresi varsa videoyu yükle ve oynat
    const videoUrl = getQueryParam('video');
    if (videoUrl) {
      const video = document.getElementById("player");
      document.getElementById("videoSource").src = videoUrl;
      video.load();
    }
  </script>
</body>
</html>
